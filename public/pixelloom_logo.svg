<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PixelLoom Architectural Emblem Icon -->
  <g transform="translate(30, 20)">
    <!-- Main Stem -->
    <rect x="18" y="15" width="17" height="90" rx="8.5" fill="#18181B"/>
    <!-- Top Beam -->
    <rect x="18" y="15" width="68" height="17" rx="8.5" fill="#18181B"/>
    <!-- Middle Crossbar -->
    <rect x="18" y="52" width="68" height="17" rx="8.5" fill="#18181B"/>
    <!-- Upper Right Column closing the P loop -->
    <rect x="69" y="15" width="17" height="54" rx="8.5" fill="#18181B"/>
    <!-- Signature Crimson Pixel Node -->
    <rect x="69" y="84" width="19" height="21" rx="6.8" fill="#E31C25"/>
  </g>

  <!-- Typography: PIXELLOOM -->
  <text x="160" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5" fill="#18181B">
    PIXEL<tspan fill="#E31C25">LOOM</tspan>
  </text>

  <!-- Subtitle: STUDIOS / OS -->
  <text x="163" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="9" fill="#8E8E93">
    STUDIOS
  </text>
</svg>
